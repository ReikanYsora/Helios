name: HACS validation

on:
  push:
    branches:
      - main
      - 'develop-**'
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        # hacs/action@main pinned by commit for reproducibility; bump periodically.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin
